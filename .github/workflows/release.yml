name: Release
on:
  push:
    tags: ['v*']
  # Validation/artifact preparation only. A dispatch never publishes.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-opencode-attention-inbox
  cancel-in-progress: false
jobs:
  validate:
    name: Validate and test exact release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
      tag: ${{ steps.pack.outputs.tag }}
      filename: ${{ steps.pack.outputs.filename }}
      prerelease: ${{ steps.pack.outputs.prerelease }}
      exists: ${{ steps.registry.outputs.exists }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Never rebuild before checking committed dist freshness.
      - run: bun run check
      - run: git diff --exit-code -- dist
      - run: bun audit
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts=--all .'
      - run: '"$(go env GOPATH)/bin/actionlint" -color'
      - id: pack
        run: node scripts/release.ts pack
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun run scripts/install-host.ts
        env:
          INBOX_HOST_BIN_DIR: ${{ runner.temp }}/inbox-bin
      - run: echo "$RUNNER_TEMP/inbox-bin" >> "$GITHUB_PATH"
      - run: timeout 300 bun run test:live --tarball ".release/$ARCHIVE"
        env:
          ARCHIVE: ${{ steps.pack.outputs.filename }}
          INBOX_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/inbox-evidence
      - id: registry
        run: node scripts/release.ts registry
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-archive
          path: .release/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: sanitized-release-tui
          path: ${{ runner.temp }}/inbox-evidence/*.txt
          if-no-files-found: ignore
          retention-days: 7
  draft:
    name: Prepare GitHub release assets
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-archive
          path: release
      - name: Create or resume draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          ARCHIVE: ${{ needs.validate.outputs.filename }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=()
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file release/notes.md "${args[@]}"
          fi
          mkdir -p existing
          for file in "$ARCHIVE" SHA256SUMS release.json; do
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              gh release download "$TAG" --pattern "$file" --dir existing
              cmp "existing/$file" "release/$file"
            else
              gh release upload "$TAG" "release/$file"
            fi
          done
      - if: needs.validate.outputs.exists != 'true'
        run: echo 'Bootstrap required. Publish the tested prerelease archive with your npm account, configure OIDC, then rerun this workflow. See RELEASING.md.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: Publish with npm OIDC
    needs: [validate, draft]
    if: github.event_name == 'push' && needs.validate.outputs.exists == 'true'
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-archive
          path: .release
      # No dependency installation or package lifecycle scripts in this privileged job.
      - run: node scripts/release.ts publish
      - run: node scripts/release.ts verify
  registry-smoke:
    name: Verify fresh native registry installation
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun run scripts/install-host.ts
        env:
          INBOX_HOST_BIN_DIR: ${{ runner.temp }}/inbox-bin
      - run: echo "$RUNNER_TEMP/inbox-bin" >> "$GITHUB_PATH"
      - run: timeout 300 bun run test:live --package "opencode-attention-inbox@$VERSION"
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          INBOX_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/inbox-registry-evidence
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: sanitized-registry-tui
          path: ${{ runner.temp }}/inbox-registry-evidence/*.txt
          if-no-files-found: ignore
          retention-days: 7
  finalize:
    name: Publish GitHub release after registry acceptance
    needs: [validate, registry-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi

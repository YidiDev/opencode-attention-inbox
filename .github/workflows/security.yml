name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Audit, history secrets and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun audit
      # Go verifies modules against the public checksum database. No executable curl pipes.
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts=--all .'
      - run: '"$(go env GOPATH)/bin/actionlint" -color'

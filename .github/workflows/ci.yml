name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # check must never build first: compare dist against an untouched checkout.
      - run: bun run check
      - run: git diff --exit-code -- dist
  packed-tui:
    name: Packed TUI (2.1.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun run scripts/install-host.ts
        env:
          INBOX_HOST_BIN_DIR: ${{ runner.temp }}/inbox-bin
      - run: echo "$RUNNER_TEMP/inbox-bin" >> "$GITHUB_PATH"
      - run: timeout 240 bun run test:live
        env:
          INBOX_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/inbox-evidence
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: sanitized-packed-tui
          path: ${{ runner.temp }}/inbox-evidence/*.txt
          if-no-files-found: ignore
          retention-days: 7

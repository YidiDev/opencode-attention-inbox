name: Latest host canary
on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canary:
    name: Latest host (not a support promise)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun run scripts/install-host.ts --latest
        env:
          INBOX_HOST_BIN_DIR: ${{ runner.temp }}/inbox-bin
      - run: echo "$RUNNER_TEMP/inbox-bin" >> "$GITHUB_PATH"
      - run: timeout 240 bun run test:live
        env:
          INBOX_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/inbox-evidence
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: sanitized-latest-host-tui
          path: ${{ runner.temp }}/inbox-evidence/*.txt
          if-no-files-found: ignore
          retention-days: 7
